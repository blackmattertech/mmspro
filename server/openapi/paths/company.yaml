/api/company/geocode:
  get:
    tags: [Company]
    summary: Search Indian addresses
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 3
        description: Search query (min 3 characters)
    responses:
      '200':
        description: Geocode results
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GeocodeResult'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/company:
  get:
    tags: [Company]
    summary: Get current organization details
    responses:
      '200':
        description: Organization with limits and usage
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: No org access
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  patch:
    tags: [Company]
    summary: Update organization details
    description: Requires org owner or admin role.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanyUpdate'
    responses:
      '200':
        description: Updated organization
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/company/locations:
  get:
    tags: [Company]
    summary: List locations
    responses:
      '200':
        description: Location list
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Location'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  post:
    tags: [Company]
    summary: Create location
    description: Requires org owner or admin role.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocationCreate'
    responses:
      '201':
        description: Location created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Limit reached or forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/company/locations/{id}:
  patch:
    tags: [Company]
    summary: Update location
    description: Requires org owner or admin role.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/LocationCreate'
              - type: object
                properties:
                  is_active:
                    type: boolean
    responses:
      '200':
        description: Updated location
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  delete:
    tags: [Company]
    summary: Soft-delete location
    description: Requires org owner or admin role.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Deactivated location
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

