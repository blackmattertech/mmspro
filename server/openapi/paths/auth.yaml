/api/auth/invite:
  post:
    tags: [Auth]
    summary: Invite a team member
    description: Requires org owner or admin role.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteRequest'
    responses:
      '200':
        description: Invite sent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/auth/invite/accept:
  post:
    tags: [Auth]
    summary: Accept an org invite
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteAcceptRequest'
    responses:
      '200':
        description: Invite accepted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
      '400':
        description: Invalid or expired invite
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Login slot limit reached
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/auth/password-reset:
  post:
    tags: [Auth]
    summary: Request password reset email
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetRequest'
    responses:
      '200':
        description: Reset email sent if account exists
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageResponse'
      '400':
        description: Email required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
