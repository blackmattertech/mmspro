/api/assets/fields:
  get:
    tags: [Assets]
    summary: List asset fields
    responses:
      '200':
        description: Asset field definitions
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AssetField'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  post:
    tags: [Assets]
    summary: Create asset field (section or parent)
    description: Super Admin only. Dropdown child values are added separately by the company.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssetFieldCreate'
    responses:
      '201':
        description: Field created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetField'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/assets/fields/reorder:
  put:
    tags: [Assets]
    summary: Reorder asset sections
    description: Requires org owner or admin role. Must include all section IDs.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssetFieldReorder'
    responses:
      '200':
        description: Reordered fields
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AssetField'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/assets/fields/template/children:
  get:
    tags: [Assets]
    summary: Download child values Excel template
    description: Company admin or users with assets update. The file includes current child values plus a Valid values sheet.
    responses:
      '200':
        description: Excel template (base64)
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                contentType:
                  type: string
                data:
                  type: string
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/assets/fields/bulk/children:
  post:
    tags: [Assets]
    summary: Bulk import child values
    description: Matching names under a parent are updated; new names are created. Existing child values not in the file are left unchanged.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: string
                description: Base64-encoded .xlsx file
    responses:
      '200':
        description: Import result
        content:
          application/json:
            schema:
              type: object
              properties:
                created:
                  type: integer
                updated:
                  type: integer
                failed:
                  type: integer
                errors:
                  type: array
                  items:
                    type: object
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/assets/fields/{id}:
  get:
    tags: [Assets]
    summary: Get asset field by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Asset field
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetField'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  patch:
    tags: [Assets]
    summary: Update asset field
    description: Super Admin edits sections/parents. Company users may send only `dropdown_options` on dropdown parents.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/AssetFieldCreate'
              - type: object
                properties:
                  is_active:
                    type: boolean
    responses:
      '200':
        description: Updated field
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetField'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  delete:
    tags: [Assets]
    summary: Delete asset field
    description: Super Admin deletes sections/parents. Company users may delete individual child values.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Field deleted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetFieldDeleteResponse'
      '400':
        description: Cannot delete (has dependents)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
